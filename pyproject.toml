[project]
name = "reinforcement-learning-maze-solver"
version = "0.1.0"
description = "Gridworld / Maze Solver with Q-Learning and SARSA"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Kheizaran Nazari Khakeshoori", email = "kheizarannazarikhakeshoori@gmail.com"}
]
maintainers = [
    {name = "Kheizaran Nazari Khakeshoori", email = "kheizarannazarikhakeshoori@gmail.com"}
]
dependencies = [
    "gymnasium>=1.0.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "pygame>=2.5.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
