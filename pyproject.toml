[project]
name = "reinforcement-learning-maze-solver"
version = "0.1.0"
description = "Gridworld / Maze Solver with Q-Learning and SARSA"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "Kheizaran Nazari Khakeshoori", email = "kheizarannazarikhakeshoori@gmail.com"}
]
maintainers = [
    {name = "Kheizaran Nazari Khakeshoori", email = "kheizarannazarikhakeshoori@gmail.com"}
]
keywords = ["reinforcement-learning", "q-learning", "sarsa", "gridworld", "gymnasium", "maze-solver"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "gymnasium>=1.0.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "pygame>=2.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov",
]
gui = [
    "pygame>=2.5.0",
]

[project.urls]
Homepage = "https://github.com/kheizaran-nazari-khakeshoori/reinforcement-learning-maze-solver"
Repository = "https://github.com/kheizaran-nazari-khakeshoori/reinforcement-learning-maze-solver"
Issues = "https://github.com/kheizaran-nazari-khakeshoori/reinforcement-learning-maze-solver/issues"
Changelog = "https://github.com/kheizaran-nazari-khakeshoori/reinforcement-learning-maze-solver/blob/main/README.md"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["maze_solver*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = []

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

# dependencies synced with requirements.txt
